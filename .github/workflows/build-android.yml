name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_release:
        description: '同时发布为 GitHub Release（按 AndroidManifest 版本号自动生成/更新 vX.Y.Z）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Test & Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run unit tests
        run: npm test

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 35 & build-tools 35.0.0
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -f "$SDK/platforms/android-35/android.jar" || ! -x "$SDK/build-tools/35.0.0/aapt2" ]]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Prepare signing keystore
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/build
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/build/release.keystore
            echo "keystore_path=android/build/release.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "keystore_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & sign Android APK
        id: build
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bash build-android.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yiqujian-apk-v${{ steps.build.outputs.version_name }}
          path: |
            ${{ steps.build.outputs.apk_path }}
            ${{ steps.build.outputs.sha256_path }}
          retention-days: 90
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.build.outputs.version_name }}
          VERSION_CODE: ${{ steps.build.outputs.version_code }}
          APK_FILENAME: ${{ steps.build.outputs.apk_filename }}
          APK_PATH: ${{ steps.build.outputs.apk_path }}
          SHA256_PATH: ${{ steps.build.outputs.sha256_path }}
          APK_SHA256: ${{ steps.build.outputs.apk_sha256 }}
          SIGNING_MODE: ${{ steps.build.outputs.signing_mode }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="v${VERSION_NAME}"
          fi

          ASSET_LABEL="易取件 ${TAG_NAME} (Android APK)"
          SHA_LABEL="SHA256 校验文件 (${APK_FILENAME}.sha256)"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            HAS_ASSET="$(gh release view "$TAG_NAME" --json assets --jq ".assets | map(.name) | index(\"${APK_FILENAME}\") != null")"
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || "$HAS_ASSET" != "true" ]]; then
              gh release upload "$TAG_NAME" \
                "${APK_PATH}#${ASSET_LABEL}" \
                "${SHA256_PATH}#${SHA_LABEL}" \
                --clobber
            else
              echo "Release ${TAG_NAME} already contains ${APK_FILENAME}; preserving existing release asset."
            fi
          else
            NOTES="$(printf '%s\n' \
              "## 易取件 ${TAG_NAME}" \
              "" \
              "- **版本**：\`v${VERSION_NAME}\`（\`versionCode: ${VERSION_CODE}\`）" \
              "- **最低系统**：Android 8.0+（API 26）" \
              "- **签名模式**：\`${SIGNING_MODE}\`" \
              "- **APK SHA-256**：\`${APK_SHA256}\`" \
              "- **权限说明**：零联网权限；短信读取与通知监听均在本地离线处理，可按需开启。")"
            gh release create "$TAG_NAME" \
              "${APK_PATH}#${ASSET_LABEL}" \
              "${SHA256_PATH}#${SHA_LABEL}" \
              --target "${GITHUB_SHA}" \
              --title "易取件 ${TAG_NAME}" \
              --notes "$NOTES"
          fi

      - name: Write build summary
        if: always() && steps.build.outcome == 'success'
        run: |
          {
            echo "### 易取件 Android 构建完成"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 版本 | \`v${{ steps.build.outputs.version_name }}\` (versionCode \`${{ steps.build.outputs.version_code }}\`) |"
            echo "| 签名模式 | \`${{ steps.build.outputs.signing_mode }}\` |"
            echo "| 文件名 | \`${{ steps.build.outputs.apk_filename }}\` |"
            echo "| 体积 | \`${{ steps.build.outputs.apk_size }}\` bytes |"
            echo "| SHA-256 | \`${{ steps.build.outputs.apk_sha256 }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up temporary keystore
        if: always()
        run: rm -f android/build/release.keystore android/build/ci-ephemeral.keystore
